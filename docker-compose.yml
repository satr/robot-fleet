services:
  postgres-timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: robot-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robot_fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot_fleet}
      POSTGRES_DB: ${POSTGRES_DB:-robot_fleet}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    container_name: robot-fleet-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mqtt:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: robot-fleet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://robot_fleet:robot_fleet@postgres-timescaledb:5432/robot_fleet
      MQTT_URL: mqtt://mqtt:1883
      RUST_LOG: ${RUST_LOG:-info}
      HTTP_PORT: 8089
    ports:
      - "8089:8089"
    depends_on:
      postgres-timescaledb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-app:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    container_name: robot-fleet-web-app
    restart: unless-stopped
    environment:
      PUBLIC_BACKEND_HTTP_URL: ${PUBLIC_BACKEND_HTTP_URL:-http://localhost:8089}
      PUBLIC_BACKEND_WS_URL: ${PUBLIC_BACKEND_WS_URL:-ws://localhost:8089}
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

  robot-01:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-01
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-01
      ROBOT_NAME: Loader One
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      ROBOT_STATE_INTERVAL_SECONDS: 1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-01:/state
    depends_on:
      mqtt:
        condition: service_healthy

  robot-02:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-02
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-02
      ROBOT_NAME: Picker Two
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      ROBOT_STATE_INTERVAL_SECONDS: 1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-02:/state
    depends_on:
      mqtt:
        condition: service_healthy

  robot-03:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-03
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-03
      ROBOT_NAME: Scout Three
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      ROBOT_STATE_INTERVAL_SECONDS: 1
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-03:/state
    depends_on:
      mqtt:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: robot-fleet-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - victoriametrics

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: robot-fleet-victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: robot-fleet-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  vmalert:
    image: victoriametrics/vmalert:v1.102.1
    container_name: robot-fleet-vmalert
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - ./infrastructure/vmalert/rules.yml:/etc/vmalert/rules.yml:ro
    command:
      - "--rule=/etc/vmalert/rules.yml"
      - "--datasource.url=http://victoriametrics:8428"
      - "--notifier.url=http://alertmanager:9093"
    depends_on:
      - victoriametrics
      - alertmanager

  grafana:
    image: grafana/grafana:10.4.4
    container_name: robot-fleet-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - victoriametrics
