global:
  scrape_interval: 5s

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:8089"]

  - job_name: robots
    static_configs:
      - targets: ["robot-01:9100", "robot-02:9100", "robot-03:9100", "host.docker.internal:9100"]
