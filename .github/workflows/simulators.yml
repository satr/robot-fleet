name: Robot simulator deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment operation
        required: true
        type: choice
        options:
          - deploy-test
          - deploy-prod
          - start-test
          - stop-test
          - start-prod
          - stop-prod
permissions:
  contents: read
  id-token: write

jobs:
  simulators:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_SIMULATOR_TEST_PROJECT: ${{ vars.GCP_SIMULATOR_TEST_PROJECT }}
      GCP_SIMULATOR_PROD_PROJECT: ${{ vars.GCP_SIMULATOR_PROD_PROJECT }}
      SIMULATOR_MQTT_URL_TEST: ${{ vars.SIMULATOR_MQTT_URL_TEST }}
      SIMULATOR_MQTT_URL_PROD: ${{ vars.SIMULATOR_MQTT_URL_PROD }}
      GCP_BILLING_ACCOUNT: ${{ secrets.GCP_BILLING_ACCOUNT }}
      IMAGE_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_SIMULATOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SIMULATOR_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Billing API
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_SIMULATOR_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          bootstrap_project_number="$(printf '%s' "${GCP_WIF_PROVIDER}" | sed -n 's#^projects/\([0-9][0-9]*\)/.*#\1#p')"
          test -n "${bootstrap_project_number}" || {
            echo "GCP_SIMULATOR_WORKLOAD_IDENTITY_PROVIDER must be a projects/... resource" >&2
            exit 1
          }
          gcloud services enable cloudbilling.googleapis.com \
            --project="${bootstrap_project_number}" --quiet

      - name: Run selected operation
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.target }}" in
            *-test)
              test -n "${GCP_SIMULATOR_TEST_PROJECT}" || {
                echo "Repository variable GCP_SIMULATOR_TEST_PROJECT is required" >&2
                exit 1
              }
              ;;
            *-prod)
              test -n "${GCP_SIMULATOR_PROD_PROJECT}" || {
                echo "Repository variable GCP_SIMULATOR_PROD_PROJECT is required" >&2
                exit 1
              }
              ;;
          esac

          case "${{ inputs.target }}" in
            deploy-test)
              test -n "${SIMULATOR_MQTT_URL_TEST}" || {
                echo "Repository variable SIMULATOR_MQTT_URL_TEST is required" >&2
                exit 1
              }
              make simulator-deploy-test \
                SIMULATOR_MQTT_URL="${SIMULATOR_MQTT_URL_TEST}" \
                SIMULATOR_USE_EXISTING_SECRETS=true
              ;;
            deploy-prod)
              test -n "${SIMULATOR_MQTT_URL_PROD}" || {
                echo "Repository variable SIMULATOR_MQTT_URL_PROD is required" >&2
                exit 1
              }
              make simulator-deploy-prod \
                SIMULATOR_MQTT_URL="${SIMULATOR_MQTT_URL_PROD}" \
                SIMULATOR_USE_EXISTING_SECRETS=true
              ;;
            start-test) make simulator-start-test ;;
            stop-test) make simulator-stop-test ;;
            start-prod) make simulator-start-prod ;;
            stop-prod) make simulator-stop-prod ;;
            *) echo "Unsupported deployment target: ${{ inputs.target }}" >&2; exit 1 ;;
          esac
