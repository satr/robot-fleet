services:
  postgres-timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: robot-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robot_fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot_fleet}
      POSTGRES_DB: ${POSTGRES_DB:-robot_fleet}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    container_name: robot-fleet-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mqtt:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: robot-fleet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - ./data/kafka:/tmp/kafka-logs

  kafka-init:
    image: apache/kafka:latest
    container_name: robot-fleet-kafka-init
    restart: "no"
    command: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: robot-fleet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://robot_fleet:robot_fleet@postgres-timescaledb:5432/robot_fleet
      MQTT_URL: mqtt://mqtt:1883
      KAFKA_BROKERS: kafka:9092
      RUST_LOG: ${RUST_LOG:-info}
      HTTP_PORT: 8089
    ports:
      - "8089:8089"
    depends_on:
      postgres-timescaledb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  robot-01:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-01
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-01
      ROBOT_NAME: Loader One
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-01:/state
    depends_on:
      mqtt:
        condition: service_healthy

  robot-02:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-02
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-02
      ROBOT_NAME: Picker Two
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-02:/state
    depends_on:
      mqtt:
        condition: service_healthy

  robot-03:
    build:
      context: .
      dockerfile: robot-simulator/Dockerfile
    container_name: robot-fleet-robot-03
    restart: unless-stopped
    environment:
      ROBOT_ID: robot-03
      ROBOT_NAME: Scout Three
      MQTT_URL: mqtt://mqtt:1883
      TELEMETRY_INTERVAL_SECONDS: 5
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data/robots/robot-03:/state
    depends_on:
      mqtt:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: robot-fleet-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus

  grafana:
    image: grafana/grafana:10.4.4
    container_name: robot-fleet-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
